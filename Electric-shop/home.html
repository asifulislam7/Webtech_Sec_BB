
<!DOCTYPE html>
<html>
<head>
    <title>ElectroShop - Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background-color: #172554;
            color: white;
            padding: 20px 40px;
        }

        nav h2 {
            display: inline;
        }

        .links {
            float: right;
        }

        .links a {
            color: white;
            text-decoration: none;
            background-color: #334477;
            padding: 10px 15px;
            margin-left: 10px;
        }

        main {
            flex: 1;
            padding: 40px 0;
        }

        .main {
            margin: 0 auto;
            padding: 30px;
            width: 85%;
            min-height: 320px;
            border: 2px solid #172554;
            overflow: auto;
        }

        .content {
            float: left;
            width: 45%;
            margin-top: 40px;
        }

        .content h1 {
            color: #172554;
            font-size: 36px;
        }

        .content p {
            color: #555;
            font-size: 17px;
            line-height: 1.6;
        }

        .image {
            float: right;
            width: 48%;
        }

        .image img {
            width: 100%;
            height: 320px;
            margin-top: 5px;
        }

        .next-btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            margin-top: 15px;
        }

        footer {
            background-color: #172554;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>ElectroShop</h2>

        <div class="links">
            <a href="adminLogin.html">Admin</a>
            <a href="deliveryLogin.html">Delivery Staff</a>
        </div>
    </nav>

    <main>
        <div class="main">

            <div class="content">
                <h1>Welcome to ElectroShop!</h1>

                <p>
                    Discover the latest electronic products at great prices.
                    Explore laptops, smartphones, headphones and accessories
                    all in one place.
                </p>

                <a href="index.html" class="next-btn">Explore Shop</a>
            </div>

            <div class="image">
                <img src="images/front.jpg" alt="Electronic Products">
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 ElectroShop. All Rights Reserved.</p>
    </footer>

</body>
</html>
